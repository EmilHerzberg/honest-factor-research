[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honest-factor-research"
version = "0.1.0"
description = "Empirical research on the limits of factor models for US equities — trust-stratified R², regime-switching betas, and block-bootstrap CIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Emil Herzberg", email = "emil.herzberg.eh@gmail.com"},
]
keywords = ["quant", "factor-model", "ridge-regression", "bootstrap", "regime-switching", "us-equities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "seaborn>=0.13",
]

[project.urls]
Homepage = "https://github.com/EmilHerzberg/honest-factor-research"
Documentation = "https://github.com/EmilHerzberg/honest-factor-research/tree/main/docs"

[tool.setuptools.packages.find]
include = ["honest_factor_research*"]

[tool.setuptools.package-data]
honest_factor_research = ["config/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
