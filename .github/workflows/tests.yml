name: tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .

      - name: Show installed package
        run: |
          pip list
          python -c "import honest_factor_research; print('Package import OK')"

      - name: Run core unit tests
        run: |
          pytest tests/test_residualization.py tests/test_bootstrap.py -v

      - name: Run smoke test if sample data is available
        run: |
          if [ -f "data/factor_etfs_2025-12-31.parquet" ]; then
            pytest tests/test_pipeline_smoke.py -v
          else
            echo "Sample snapshot missing — skipping smoke test."
          fi

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff (non-blocking)
        continue-on-error: true
        run: ruff check honest_factor_research/ examples/ tests/
