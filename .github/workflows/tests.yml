name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show installed package
        run: pip show honest-factor-research

      - name: Run unit tests
        run: |
          # Skip the pipeline-smoke test by default — it needs the bundled
          # parquet snapshot and yfinance access. The pure-math tests
          # (residualization + block-bootstrap) run unconditionally.
          pytest tests/test_residualization.py tests/test_bootstrap.py -v

      - name: Run smoke test if sample data present
        run: |
          if [ -f "data/factor_etfs_2026-05-21.parquet" ]; then
            pytest tests/test_pipeline_smoke.py -v
          else
            echo "Sample snapshot missing — skipping smoke test."
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff (non-blocking)
        # Lint findings won't fail CI yet — the codebase is research-grade.
        # Once we add proper formatting passes, switch to `ruff check` only.
        continue-on-error: true
        run: ruff check honest_factor_research/ examples/ tests/
